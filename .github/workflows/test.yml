name: Tests

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  # publish.yml calls this on a release tag, so the wheel that ships is
  # the one built and smoke-tested here.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      # the same ruff CONTRIBUTING.md asks for: a new release's rules
      # arrive when this is moved, not on an unrelated push
      - run: pip install ruff==0.16.9
      - run: ruff check src tests scripts

  test:
    runs-on: ${{ matrix.os }}
    # A test that hangs ends the job here instead of at GitHub's six
    # hours, and faulthandler_timeout (pyproject.toml) has already
    # printed where.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # One macOS leg: the code carries BSD/%-I workarounds that only
          # a Darwin runner actually exercises.
          - os: macos-latest
            python-version: "3.14"
          # One Windows leg: console modes, USERPROFILE, and UTF-8 reads
          # only mean anything on a Windows runner. hermetic and smoke
          # stay POSIX-only (chmod 555, venv/bin/, shell scripts).
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # Editable, so the tests see the worktree's src and the version
        # the installed package reports is the real one.
        run: |
          pip install -e .
          pip install pytest pytest-xdist

      # The completion scripts are run in the shells they are written
      # for. Those tests skip where a shell is missing, so the Linux
      # legs install every shell and require them all: a missing shell
      # fails instead of skipping (2.6.1 shipped a script no shell would
      # load, through a skip).
      - name: Install the completion shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zsh fish
      - uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        if: runner.os == 'Linux'

      # -n auto: a worker for each of the runner's cores
      - name: Run tests
        env:
          LINECAST_REQUIRE_SHELLS: ${{ runner.os == 'Linux' && 'bash zsh fish nu' || '' }}
        run: pytest tests -q -p no:cacheprovider -n auto

  hermetic:
    # The suite must touch neither the real home nor the user's settings.
    # HOME is a directory nothing can write to, and the environment
    # carries settings that would change every rendered snapshot if a
    # test read them, plus a proxy that would reroute every fetch.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install into a venv
        # Before HOME moves, so pip never needs a writable home.
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -e . pytest pytest-xdist

      - name: Run tests with a read-only home and hostile settings
        run: |
          mkdir "$RUNNER_TEMP/home"
          chmod 555 "$RUNNER_TEMP/home"
          env HOME="$RUNNER_TEMP/home" \
              XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config" \
              XDG_CACHE_HOME="$RUNNER_TEMP/home/.cache" \
              WEATHER_UNITS=metric LINECAST_TEMP=1 LINECAST_LANG=fr \
              LINECAST_THEME=off LINECAST_CELL_ASPECT=2.5 \
              LINECAST_WEEK_START=sunday LINECAST_RADAR_SOURCE=iem \
              https_proxy=http://127.0.0.1:1 \
              "$RUNNER_TEMP/venv/bin/python" -m pytest tests -q -p no:cacheprovider -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - run: pip install build

      # The README refers to its screenshots and pages by relative path,
      # so GitHub shows each branch its own. PyPI has nowhere to resolve
      # them, so the package's copy points at this commit instead.
      - name: Pin the README's links to this commit
        run: python scripts/pin_readme.py README.md "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      - name: Build the wheel and sdist
        run: python -m build

      - name: Check that both carry the data files
        run: sh scripts/check_dist.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      # The single file for the GitHub release, from the same wheel. It
      # is its own artifact: everything in dist goes to PyPI.
      - name: Build linecast.pyz
        run: |
          pip install shiv==1.0.8
          sh scripts/build_pyz.sh dist pyz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyz
          path: pyz/linecast.pyz
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
          # The oldest interpreter the wheel claims to support.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"

    steps:
      # The checkout is only here for the scripts. The wheel is installed
      # and run from outside it, so the source tree can never stand in
      # for what the wheel forgot to ship.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist

      - name: Install the wheel into a fresh venv
        run: |
          cd "$RUNNER_TEMP"
          python -m venv venv
          venv/bin/pip install dist/*.whl
          wheel=$(basename dist/*.whl)
          echo "WHEEL_VERSION=$(echo "$wheel" | cut -d- -f2)" >> "$GITHUB_ENV"

      - name: Smoke-test the installed commands
        run: |
          PATH="$RUNNER_TEMP/venv/bin:$PATH" \
            sh scripts/smoke_wheel.sh "$WHEEL_VERSION"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pyz
          path: ${{ runner.temp }}/pyz

      - name: Smoke-test linecast.pyz
        # The same checks, with the pyz on PATH as linecast and run by
        # this leg's python3. Artifacts lose the executable bit.
        run: |
          mkdir "$RUNNER_TEMP/pyzbin"
          cp "$RUNNER_TEMP/pyz/linecast.pyz" "$RUNNER_TEMP/pyzbin/linecast"
          chmod +x "$RUNNER_TEMP/pyzbin/linecast"
          PATH="$RUNNER_TEMP/pyzbin:$PATH" \
            sh scripts/smoke_wheel.sh "$WHEEL_VERSION"

      - name: Run the installer against the wheel
        run: sh scripts/check_get_sh.sh "$RUNNER_TEMP/dist"

      - name: Run the installer against the wheel as root
        # The harness can only check that get.sh refuses a cache directory
        # or venv owned by someone else when it can chown, so it runs once
        # more as root.  sudo replaces PATH with its secure_path, which is
        # why the PATH setup-python built is handed back through env.
        if: runner.os == 'Linux'
        run: sudo env PATH="$PATH" sh scripts/check_get_sh.sh "$RUNNER_TEMP/dist"
