name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  # Lint, test, build, and smoke-test on the tag. The build job leaves
  # the wheel and sdist in the dist artifact.
  verify:
    uses: ./.github/workflows/test.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # No checkout and no build here. What goes to PyPI is the artifact
      # the smoke job installed, byte for byte.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Check the artifact
        run: |
          ls -la dist
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
