name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Lint, test, build, and smoke-test on the tag. The build job leaves
  # the wheel and sdist in the dist artifact.
  verify:
    uses: ./.github/workflows/test.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # No checkout and no build here. What goes to PyPI is the artifact
      # the smoke job installed, byte for byte.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Check the artifact
        run: |
          ls -la dist
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  attach:
    # linecast.pyz goes on the GitHub Release that release.sh made, once
    # PyPI has the same version. Its name never changes, so
    # releases/latest/download/linecast.pyz is always the newest, and
    # the pyz points there when it finds PyPI ahead of it.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyz
          path: pyz

      - name: Attach linecast.pyz to the release
        # --clobber, so re-running a failed job can replace a partial upload.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" pyz/linecast.pyz \
            --repo "$GITHUB_REPOSITORY" --clobber
