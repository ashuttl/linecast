name: Live providers

# Asks every data provider linecast talks to whether it still answers
# in the shape the code expects, once a day. The ordinary test suite
# never touches the network; this is the one place the real feeds are
# exercised.
#
# Most failures are a provider's bad morning, gone by the next day. So
# a test that fails once is a warning on the run, and the run stays
# green. A test that fails on two runs a day apart turns the run red
# and opens an issue, which stays open until it passes.

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read   # to fetch the earlier run's report

concurrency:
  group: live-providers
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install
        run: |
          pip install -e .
          pip install pytest

      - name: Ask every provider
        id: probe
        env:
          # Optional: a TideCheck key in the repository secrets brings
          # that provider into the check; without it the test skips.
          LINECAST_LIVE_TIDECHECK_KEY: ${{ secrets.LINECAST_LIVE_TIDECHECK_KEY }}
        run: |
          set +e
          probe() {
              pytest tests/test_live_providers.py -m integration \
                  -q -o cache_dir="$RUNNER_TEMP/pytest-cache" -rfEs --tb=short \
                  "$@" 2>&1 | tee "$RUNNER_TEMP/report.txt"
              return "${PIPESTATUS[0]}"
          }
          probe
          status=$?
          if [ "$status" -ne 0 ]; then
              # Most failures are a provider's passing hiccup: ask the
              # failed ones again a few minutes later before reporting.
              sleep 300
              probe --last-failed
              status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Kept for the next day's run to compare against.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-report
          path: ${{ runner.temp }}/report.txt
          retention-days: 14

      # The newest finished run from at least 20 hours ago: yesterday's
      # scheduled run, whether this one is scheduled or started by hand.
      # A run started by hand an hour after a failure is not a second day.
      - name: Fetch the report from a day before
        id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          run=$(gh run list --workflow live.yml --status completed --limit 30 \
                --json databaseId,createdAt \
                --jq "[.[] | select(.createdAt <= \"$cutoff\")][0].databaseId // empty")
          if [ -n "$run" ] && gh run download "$run" --name live-report --dir "$RUNNER_TEMP/earlier"; then
              echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/$run" >> "$GITHUB_OUTPUT"
          else
              echo "no earlier report; nothing can count as failing twice on this run"
          fi

      - name: Open, update, or close the issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EARLIER_URL: ${{ steps.earlier.outputs.url }}
        run: >-
          sh scripts/live_issue.sh "${{ steps.probe.outputs.status }}"
          "$RUNNER_TEMP/report.txt" "$RUNNER_TEMP/earlier/report.txt"

      - name: Report the result
        run: test "${{ steps.issue.outputs.failing }}" = 0
