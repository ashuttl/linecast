[project]
name = "linecast"
version = "2.3.2"
description = "Weather, tides, the sun, the moon, and maps, drawn for the terminal. The Old Farmer's Almanac meets Minitel."
authors = [{name = "Andrew Shuttleworth Fowler"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["weather", "radar", "terminal", "cli", "tides", "solar", "moon", "maps", "braille", "true-color"]
classifiers = [
    "Environment :: Console",
    "Topic :: Utilities",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Windows ships no IANA time zone database, so zoneinfo has nothing to
    # read: every ZoneInfo(...) raises and the tz lookups fall back to the
    # machine zone, which is the wrong zone for anywhere but here.
    "tzdata; sys_platform == 'win32'",
    # Windows caches trusted roots lazily, so Python's ssl sees only the
    # handful it has met; truststore asks the OS to verify instead.
    "truststore; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/ashuttl/linecast"
Issues = "https://github.com/ashuttl/linecast/issues"

# Only `linecast` is installed. The short names (weather, sunshine,
# moon, tides, radar, maps) are common words that other packages also
# claim — /usr/bin/sunshine belongs to the Sunshine streaming server
# where it is installed (issue #20) — so they are left to the user: the
# binary dispatches on argv[0], and a symlink or alias named `weather`
# runs the weather command.
[project.scripts]
linecast = "linecast.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linecast"]
# The data ships regardless of any ignore rule; CI checks the built wheel for it.
artifacts = ["src/linecast/data/*"]

[tool.hatch.build.targets.sdist]
# Keep the sdist lean: screenshots alone are ~12 MB, and the Homebrew
# formula (and anyone building from source) downloads the sdist.
exclude = [
  "screenshots/",
  "prototype/",
  "scripts/",
  ".github/",
  ".claude/",
  "get.sh",
  "release.sh",
  "release-homebrew.sh",
  "uv.lock",
]

[tool.pytest.ini_options]
# tests/conftest.py blocks the network and moves HOME for every test
# except those marked integration. Those are left out by default, so a
# plain `pytest tests` is hermetic; `-m integration` on the command
# line runs them alone (tests/test_live_providers.py).
addopts = "-m 'not integration'"
markers = ["integration: may reach the network or the real home directory"]

[tool.ruff]
# The house lint: ruff's defaults (pyflakes and the pycodestyle errors)
# plus bugbear and whitespace, at a 100-column line.  Lint, not format —
# the code is wrapped by hand.  `ruff check src tests scripts` runs it;
# CI runs the same.
line-length = 100
target-version = "py310"
extend-exclude = ["prototype", ".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "B", "W"]
ignore = [
  "B905",  # zip(strict=) on every zip is noise in code that pairs equal-length rows by construction
]

[tool.ruff.lint.per-file-ignores]
# Tests put the worktree's src on sys.path before importing linecast.
"tests/*" = ["E402"]
# The translation tables carry whole sentences; wrapping them helps no one.
"src/linecast/_*_i18n.py" = ["E501"]
