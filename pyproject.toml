[project]
name = "linecast"
version = "1.13.0"
description = "Weather, tides, the sun, the moon, and maps, drawn for the terminal. The Old Farmer's Almanac meets Minitel."
authors = [{name = "Andrew Shuttleworth Fowler"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["weather", "radar", "terminal", "cli", "tides", "solar", "moon", "maps", "braille", "true-color"]
classifiers = [
    "Environment :: Console",
    "Topic :: Utilities",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/ashuttl/linecast"
Issues = "https://github.com/ashuttl/linecast/issues"

[project.scripts]
linecast = "linecast.__main__:main"
weather = "linecast.weather:main"
sunshine = "linecast.sunshine:main"
moon = "linecast.moon:main"
tides = "linecast.tides:main"
radar = "linecast.radar:main"
maps = "linecast.maps:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linecast"]
artifacts = ["src/linecast/data/*.json.gz"]

[tool.hatch.build.targets.sdist]
# Keep the sdist lean: screenshots alone are ~12 MB, and the Homebrew
# formula (and anyone building from source) downloads the sdist.
exclude = [
  "screenshots/",
  "prototype/",
  "scripts/",
  ".github/",
  ".claude/",
  "get.sh",
  "release.sh",
  "release-homebrew.sh",
  "uv.lock",
]
